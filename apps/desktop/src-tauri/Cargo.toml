[package]
name = "sandglass"
version = "0.1.0"
description = "Desktop GUI for Eclipse Enclave agent sandboxes"
authors = ["Sandglass"]
edition = "2021"

[lib]
name = "sandglass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
parking_lot = "0.12"
dirs = "6"
which = "7"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
